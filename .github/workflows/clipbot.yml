name: ClipBot

on:
  schedule:
    - cron: "*/10 * * * *"   # check To Post every 10 min (GitHub can run a few min late)
  workflow_dispatch:          # "Run workflow" button for a manual run

concurrency:
  group: clipbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Anything to post?
        id: check
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
        run: |
          pip install -q google-api-python-client google-auth pyyaml pydantic
          python check_inbox.py >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.has_clips == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + Python packages
        if: steps.check.outputs.has_clips == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r requirements.txt

      - name: Cache Whisper model
        if: steps.check.outputs.has_clips == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Edit and post
        if: steps.check.outputs.has_clips == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python cloud_bot.py
